$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: KairosMarkets Docs
  structure:
    - type: section
      key: section-whitepaper
      title: 白皮书
      localizedTitle:
        en: Whitepaper
      path: whitepaper
      default: true
      children:
        - type: space
          key: space-whitepaper-zh
          title: 简体中文
          path: zh
          default: true
          content:
            directory: ./whitepaper/zh
            language: zh
        - type: space
          key: space-whitepaper-en
          title: English
          path: en
          content:
            directory: ./whitepaper/en
            language: en
    - type: section
      key: section-one-pager
      title: 一页简介
      localizedTitle:
        en: One Pager
      path: one-pager
      children:
        - type: space
          key: space-one-pager-zh
          title: 简体中文
          path: zh
          default: true
          content:
            directory: ./one-pager/zh
            language: zh
        - type: space
          key: space-one-pager-en
          title: English
          path: en
          content:
            directory: ./one-pager/en
            language: en
